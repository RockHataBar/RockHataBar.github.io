<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>RockHata Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Johnson';
      src: url('Johnson.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: swap;
    }

    :root {
      --gold: #e6b93e;
      --gold-dim: rgba(230, 185, 62, 0.75);
      --chip-active-bg: #6e5f2c;
      --bg: #0a0a0b;
      --text: #f2f0ea;
      --secondary: #9c9a95;
      --nav-bg: rgba(10, 10, 11, 0.94);
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 110px;
      height: 101%;
    }

    body {
      margin: 0;
      padding: 0 0 40px 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Johnson', 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }

    #menu-content { padding: 0 16px; max-width: 720px; margin: 0 auto; }

    /* ================= ШАПКА ================= */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid #201f1a;
    }

    .brand-header {
      text-align: center;
      padding: 16px 20px 10px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--gold);
    }

    .brand-tag {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--secondary);
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* ================= ЧІПИ-КАТЕГОРІЇ ================= */
    .chips-bar {
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      gap: 18px;
      padding: 10px 16px 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .chips-bar::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      display: inline-block;
      color: var(--gold-dim);
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 0.4px;
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 999px;
      transition: background 0.25s, color 0.25s;
    }

    .chip.active {
      color: #fff;
      background: var(--chip-active-bg);
    }

    /* ================= РОЗДІЛИ ================= */
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--secondary);
      margin: 28px 4px 6px;
    }

    .section-title::before {
      content: '';
      width: 14px;
      height: 2px;
      background: var(--gold);
      display: inline-block;
    }

    section:first-of-type .section-title { margin-top: 4px; }

    /* ================= РЯДОК ТОВАРУ ================= */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.16);
    }

    section .items-list .item-row:last-child { border-bottom: none; }

    .item-info { flex: 1; min-width: 0; }

    .item-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      color: var(--gold);
      line-height: 1.25;
    }

    .item-price {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      color: var(--gold);
      margin-top: 3px;
    }

    .item-desc {
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.45;
      margin-top: 8px;
    }

    .item-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      color: var(--secondary);
      font-size: 12px;
    }

    .item-stats svg { flex-shrink: 0; opacity: 0.8; }

    .item-photo {
      width: 104px;
      height: 132px;
      flex-shrink: 0;
      cursor: pointer;
      overflow: hidden;
      border-radius: 14px;
      background: #151513;
    }
    .item-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ================= МОДАЛКА ФОТО ================= */
    #modal {
      display: none; position: fixed; z-index: 2000; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.95);
      justify-content: center; align-items: center; cursor: zoom-out;
    }
    #modal img { max-width: 90%; max-height: 80%; border-radius: 14px; border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(230, 185, 62, 0.3); }

    @media (min-width: 768px) {
      .chips-bar { justify-content: center; }
      .item-photo { width: 120px; height: 150px; }
    }

    /* ================= КНОПКА ЗВОРОТНОГО ЗВ'ЯЗКУ ================= */
    .feedback-btn {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--gold);
      color: #14140f;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      text-decoration: none;
    }
    .feedback-btn svg { width: 24px; height: 24px; }
  </style>
</head>
<body id="top">

  <nav class="navbar">
    <div class="brand-header">
      <a href="#top" style="text-decoration:none;">
        <div class="brand-name">ROCK HATA</div>
      </a>
      <div class="brand-tag">Bar Menu</div>
    </div>
    <div class="chips-bar">
      <a href="#cocktails" class="chip">Коктейлі</a>
      <a href="#drinks" class="chip">Напої</a>
      <a href="#beer" class="chip">Пиво</a>
      <a href="#shots" class="chip">Шоти</a>
      <a href="#snacks" class="chip">Снеки</a>
      <a href="#nastoyanky" class="chip">Настоянки</a>
      <a href="#liqueurs" class="chip">Лікери</a>
    </div>
  </nav>

  <div id="menu-content">
    <section id="cocktails"><h2 class="section-title">Коктейлі</h2><div class="items-list" id="menu-cocktails"></div></section>
    <section id="drinks"><h2 class="section-title">Напої</h2><div class="items-list" id="menu-drinks"></div></section>
    <section id="beer"><h2 class="section-title">Пиво</h2><div class="items-list" id="menu-beer"></div></section>
    <section id="shots"><h2 class="section-title">Шоти</h2><div class="items-list" id="menu-shots"></div></section>
    <section id="snacks"><h2 class="section-title">Снеки</h2><div class="items-list" id="menu-snacks"></div></section>
    <section id="nastoyanky"><h2 class="section-title">Настоянки</h2><div class="items-list" id="menu-nastoyanky"></div></section>
    <section id="liqueurs"><h2 class="section-title">Лікери</h2><div class="items-list" id="menu-liqueurs"></div></section>
  </div>

  <div id="modal" onclick="this.style.display='none'; document.body.style.overflow='auto'">
    <img id="modal-img" src="" alt="View">
  </div>

  <a class="feedback-btn"
     href="https://t.me/O1010100001?text=Добрий день! Хочу залишити відгук/скаргу щодо ROCK HATA:%0A"
     target="_blank" rel="noopener"
     aria-label="Залишити відгук або скаргу"
     title="Залишити відгук або скаргу">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </a>

  <script src="menu-data.js"></script>
  <script>
    const VOLUME_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1.5 15a2 2 0 0 1-2 1.8h-5a2 2 0 0 1-2-1.8L6 3Z"/><path d="M5 3h14"/></svg>`;

    function openModal(src) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modal-img');
      modalImg.src = src;
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function renderMenu(items, containerId) {
      const menuDiv = document.getElementById(containerId);
      if (!menuDiv) return;
      items.forEach((drink) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'item-row';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'item-info';
        infoDiv.innerHTML = `
          <div class="item-name">${drink.name}</div>
          <div class="item-price">${drink.price}</div>
          ${drink.desc ? `<div class="item-desc">${drink.desc}</div>` : ''}
          ${drink.volume ? `<div class="item-stats">${VOLUME_ICON}<span>${drink.volume}</span></div>` : ''}
        `;
        rowDiv.appendChild(infoDiv);

        if (drink.img) {
          const photoDiv = document.createElement('div');
          photoDiv.className = 'item-photo';
          photoDiv.onclick = () => openModal(drink.img);
          photoDiv.innerHTML = `<img src="${drink.img}" alt="${drink.name}" loading="lazy">`;
          rowDiv.appendChild(photoDiv);
        }

        menuDiv.appendChild(rowDiv);
      });
    }

    Object.entries(menuData).forEach(([key, items]) => renderMenu(items, `menu-${key}`));

    // Раздели йдуть у DOM у тому ж порядку, що й на сторінці — це і є
    // джерело правди для того, який розділ зараз під шапкою.
    const sections = Array.from(document.querySelectorAll('section'));
    const navLinks = document.querySelectorAll('.chip');
    const navbarEl = document.querySelector('.navbar');

    function getHeaderOffset() {
      return (navbarEl ? navbarEl.offsetHeight : 0) + 16;
    }

    function updateScrollPadding() {
      document.documentElement.style.scrollPaddingTop = getHeaderOffset() + 'px';
    }

    function updateActiveChip() {
      const scrollPos = window.scrollY + getHeaderOffset() + 1;
      let currentId = sections[0] && sections[0].id;
      for (const section of sections) {
        if (section.offsetTop <= scrollPos) {
          currentId = section.id;
        } else {
          break;
        }
      }
      navLinks.forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === `#${currentId}`);
      });
    }

    let ticking = false;
    function onScroll() {
      if (!ticking) {
        requestAnimationFrame(() => { updateActiveChip(); ticking = false; });
        ticking = true;
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', () => { updateScrollPadding(); updateActiveChip(); });

    updateScrollPadding();
    updateActiveChip();
  </script>
</body>
</html>

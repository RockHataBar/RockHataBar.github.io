services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rockhata
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: rockhata
    volumes:
      - db-data:/var/lib/postgresql/data
    # No ports exposed to the host — only the backend container talks to it.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: rockhata
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: rockhata
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_REPO_URL: ${GITHUB_REPO_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-ROCK HATA Admin Panel}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-admin-panel@rockhata.local}
    ports:
      - "127.0.0.1:3000:3000" # only reachable on the laptop itself + via the tunnel below
    volumes:
      - repo-clone:/repo

  # Free, no domain and no Cloudflare account needed — a "quick tunnel"
  # gives a random https://<words>.trycloudflare.com address that changes
  # each time this container restarts. Find the current address with:
  #   docker compose logs cloudflared | grep trycloudflare
  # Lives only as long as the laptop (and Docker) is up.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --url http://backend:3000
    depends_on:
      - backend
    profiles:
      - tunnel # `docker compose --profile tunnel up -d` to start it

volumes:
  db-data:
  repo-clone:

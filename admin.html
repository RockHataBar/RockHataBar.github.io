<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKHATA — Редагування меню</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #d32f2f;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 100px;
        }

        h1, h2, h3, p { margin: 0; }

        header {
            max-width: 900px;
            margin: 0 auto 20px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .toolbar {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-primary { background-color: var(--primary-color); color: #fff; }
        .btn-secondary { background-color: var(--surface-color); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-danger { background-color: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); }
        .btn-small { padding: 6px 10px; font-size: 12px; }

        #status {
            max-width: 900px;
            margin: 0 auto 20px;
            font-size: 13px;
            color: var(--text-muted);
            min-height: 18px;
        }

        .categories {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 15px;
        }

        .category-head {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .category-head input[name="title"] { flex-grow: 1; font-size: 18px; font-weight: bold; }
        .category-head input[name="id"] { width: 110px; color: var(--text-muted); }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        input, textarea {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 8px;
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .item-card {
            background-color: #262626;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .item-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .item-grid .full { grid-column: 1 / -1; }

        .item-foot {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .field { margin-bottom: 0; }

        .add-item-btn { margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>ROCKHATA — Редагування меню</h1>
        <p>
            Локальний інструмент без сервера: правки зберігаються тільки в цьому браузері (чернетка),
            поки ви не натиснете «Скачати menu-data.js» і не замінете файл у проєкті.
            Джерело правди — файл <code>menu-data.js</code> в репозиторії.
        </p>
    </header>

    <div class="toolbar">
        <button class="btn-primary" id="downloadBtn">Скачати menu-data.js</button>
        <button class="btn-secondary" id="addCategoryBtn">+ Категорія</button>
        <button class="btn-danger" id="resetBtn">Скинути чернетку до файлу</button>
    </div>

    <div id="status"></div>

    <div class="categories" id="categories"></div>

    <script src="menu-data.js"></script>
    <script>
        const DRAFT_KEY = 'rockhata_menu_draft_v1';
        let state = [];

        function esc(str) {
            return String(str === undefined || str === null ? '' : str)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'");
        }

        function uid(prefix) {
            return prefix + Math.random().toString(36).slice(2, 7);
        }

        function loadInitialState() {
            const draft = localStorage.getItem(DRAFT_KEY);
            if (draft) {
                try {
                    setStatus('Завантажено чернетку з цього браузера (ще не скачана).');
                    return JSON.parse(draft);
                } catch (e) { /* ignore corrupt draft */ }
            }
            return JSON.parse(JSON.stringify(typeof menuData !== 'undefined' ? menuData : []));
        }

        function saveDraft() {
            localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
            setStatus('Чернетку автозбережено в браузері о ' + new Date().toLocaleTimeString());
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function render() {
            const container = document.getElementById('categories');
            container.innerHTML = '';

            state.forEach((category, catIndex) => {
                const card = document.createElement('div');
                card.className = 'category-card';

                const head = document.createElement('div');
                head.className = 'category-head';
                head.innerHTML = `
                    <input name="title" value="${escapeAttr(category.title)}" placeholder="Назва категорії">
                    <input name="id" value="${escapeAttr(category.id)}" placeholder="id">
                `;
                const delCatBtn = document.createElement('button');
                delCatBtn.className = 'btn-danger btn-small';
                delCatBtn.textContent = 'Видалити категорію';
                delCatBtn.onclick = () => {
                    if (confirm(`Видалити категорію "${category.title}" разом з усіма товарами?`)) {
                        state.splice(catIndex, 1);
                        saveDraft();
                        render();
                    }
                };
                head.appendChild(delCatBtn);
                card.appendChild(head);

                head.querySelector('[name="title"]').oninput = (e) => { category.title = e.target.value; saveDraft(); };
                head.querySelector('[name="id"]').oninput = (e) => { category.id = e.target.value; saveDraft(); };

                category.items.forEach((item, itemIndex) => {
                    const itemCard = document.createElement('div');
                    itemCard.className = 'item-card';
                    itemCard.innerHTML = `
                        <div class="item-grid">
                            <div class="field">
                                <label>Назва</label>
                                <input name="name" value="${escapeAttr(item.name)}">
                            </div>
                            <div class="field">
                                <label>Ціна, ₴</label>
                                <input name="price" type="number" value="${escapeAttr(item.price)}">
                            </div>
                            <div class="field full">
                                <label>Опис</label>
                                <input name="desc" value="${escapeAttr(item.desc)}">
                            </div>
                            <div class="field full">
                                <label>Посилання на фото (URL)</label>
                                <input name="img" value="${escapeAttr(item.img)}">
                            </div>
                            <div class="field">
                                <label>id товару</label>
                                <input name="id" value="${escapeAttr(item.id)}">
                            </div>
                        </div>
                        <div class="item-foot">
                            <button class="btn-danger btn-small" data-action="del-item">Видалити товар</button>
                        </div>
                    `;
                    itemCard.querySelector('[name="name"]').oninput = (e) => { item.name = e.target.value; saveDraft(); };
                    itemCard.querySelector('[name="price"]').oninput = (e) => { item.price = Number(e.target.value) || 0; saveDraft(); };
                    itemCard.querySelector('[name="desc"]').oninput = (e) => { item.desc = e.target.value; saveDraft(); };
                    itemCard.querySelector('[name="img"]').oninput = (e) => { item.img = e.target.value; saveDraft(); };
                    itemCard.querySelector('[name="id"]').oninput = (e) => { item.id = e.target.value; saveDraft(); };
                    itemCard.querySelector('[data-action="del-item"]').onclick = () => {
                        category.items.splice(itemIndex, 1);
                        saveDraft();
                        render();
                    };
                    card.appendChild(itemCard);
                });

                const addItemBtn = document.createElement('button');
                addItemBtn.className = 'btn-secondary btn-small add-item-btn';
                addItemBtn.textContent = '+ Товар';
                addItemBtn.onclick = () => {
                    category.items.push({ id: uid('item_'), name: '', desc: '', price: 0, img: '' });
                    saveDraft();
                    render();
                };
                card.appendChild(addItemBtn);

                container.appendChild(card);
            });
        }

        function escapeAttr(value) {
            return String(value === undefined || value === null ? '' : value).replace(/"/g, '&quot;');
        }

        function generateMenuDataJs() {
            const categoriesJs = state.map(category => {
                const itemsJs = category.items.map(item => (
                    `            { id: '${esc(item.id)}', name: '${esc(item.name)}', desc: '${esc(item.desc)}', price: ${Number(item.price) || 0}, img: '${esc(item.img)}' }`
                )).join(',\n');
                return `    {\n        id: '${esc(category.id)}',\n        title: '${esc(category.title)}',\n        items: [\n${itemsJs}\n        ]\n    }`;
            }).join(',\n');

            return `// ================= БАЗА ДАНИХ МЕНЮ =================\n// Заповніть вашими реальними позиціями\nconst menuData = [\n${categoriesJs}\n];\n`;
        }

        document.getElementById('addCategoryBtn').onclick = () => {
            state.push({ id: uid('cat_'), title: 'Нова категорія', items: [] });
            saveDraft();
            render();
        };

        document.getElementById('resetBtn').onclick = () => {
            if (confirm('Скинути всі незбережені правки і завантажити меню заново з menu-data.js?')) {
                localStorage.removeItem(DRAFT_KEY);
                state = JSON.parse(JSON.stringify(typeof menuData !== 'undefined' ? menuData : []));
                setStatus('Чернетку скинуто, завантажено поточний menu-data.js.');
                render();
            }
        };

        document.getElementById('downloadBtn').onclick = () => {
            const content = generateMenuDataJs();
            const blob = new Blob([content], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'menu-data.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus('Файл menu-data.js скачано. Замініть ним файл у проєкті і закомітьте.');
        };

        state = loadInitialState();
        render();
    </script>
</body>
</html>
